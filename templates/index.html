<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceSecure - AI Face Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            color: white;
        }
        .btn-outline-gradient {
            border: 2px solid #667eea;
            color: #667eea;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-outline-gradient:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="hero-card text-center">
                    <h1 class="display-4 fw-bold mb-3">FaceSecure</h1>
                    <p class="lead mb-4 text-muted">AI-Powered Face Authentication System</p>
                    <p class="mb-4">Secure login with face recognition and liveness detection</p>
                    <div class="d-flex gap-3 justify-content-center">
                        <a href="/register" class="btn btn-gradient">Register</a>
                        <a href="/login" class="btn btn-outline-gradient">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
