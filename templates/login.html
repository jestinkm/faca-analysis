<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FaceSecure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            width: 100%;
        }
        .btn-gradient:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-card">
                    <h2 class="text-center mb-4">Welcome Back</h2>
                    <p class="text-center text-muted mb-4">Login with face authentication</p>
                    
                    <div id="alertContainer"></div>
                    
                    <div class="mb-4">
                        <p class="text-muted small">
                            <i class="bi bi-info-circle"></i> 
                            Face verification will start automatically. Please ensure your camera is ready.
                        </p>
                    </div>
                    
                    <button class="btn btn-gradient" id="loginBtn">
                        <span id="loginText">Login with Face</span>
                        <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2" style="display:none;"></span>
                    </button>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted">Don't have an account? <a href="/register">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', handleLogin);

        async function handleLogin() {
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            loginBtn.disabled = true;
            loginText.textContent = 'Verifying face...';
            loginSpinner.style.display = 'inline-block';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    showAlert(`Welcome back, ${data.user}!`, 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showAlert(data.message, 'danger');
                    loginBtn.disabled = false;
                    loginText.textContent = 'Login with Face';
                    loginSpinner.style.display = 'none';
                }
            } catch (err) {
                showAlert('Login failed. Please try again.', 'danger');
                loginBtn.disabled = false;
                loginText.textContent = 'Login with Face';
                loginSpinner.style.display = 'none';
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
